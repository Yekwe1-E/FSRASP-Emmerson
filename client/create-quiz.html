<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Quiz - FSARAP | Niger Delta University</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container flex items-center justify-between">
      <a href="index.html" class="nav-brand">
        <div class="nav-logo-badge">NDU</div>
        <div>
          <span>FSARAP</span>
          <span style="font-size: 0.75rem; font-weight: 500; display: block; color: var(--text-muted);">Faculty of Science</span>
        </div>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="repository.html" class="nav-link">Repository</a></li>
        <li><a href="quizzes.html" class="nav-link active">Quizzes</a></li>
      </ul>

      <div style="display: flex; align-items: center; gap: 1rem;">
        <button onclick="toggleTheme()" class="theme-toggle" title="Toggle Theme">🌙</button>
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </nav>

  <!-- Lecturer Quiz Creator Main View -->
  <main style="padding: 3.5rem 0;">
    <div class="container" style="max-width: 800px;">
      
      <!-- STEP 1: Quiz Details -->
      <div class="card mb-4" style="padding: 2.5rem;">
        <div class="mb-3">
          <span class="badge badge-primary mb-1">Lecturer Assessment Builder</span>
          <h2>Step 1: Quiz Configuration</h2>
          <p class="text-muted" style="font-size: 0.9rem;">Set quiz title, course code, duration, and pass mark.</p>
        </div>

        <form id="create-quiz-form">
          <div class="form-group">
            <label class="form-label" for="quiz-title">Quiz Title</label>
            <input type="text" id="quiz-title" class="form-control" placeholder="e.g. Mid-Semester Self-Assessment: CSC 111 Programming Concepts" required>
          </div>

          <div class="grid grid-cols-2 gap-1">
            <div class="form-group">
              <label class="form-label" for="quiz-course">Course</label>
              <select id="quiz-course" class="form-select" required>
                <option value="">Loading Courses...</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="quiz-duration">Duration (Minutes)</label>
              <input type="number" id="quiz-duration" class="form-control" value="20" min="5" max="180" required>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-1">
            <div class="form-group">
              <label class="form-label" for="quiz-passmark">Pass Mark (%)</label>
              <input type="number" id="quiz-passmark" class="form-control" value="50" min="10" max="100" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="quiz-maxattempts">Maximum Allowed Attempts</label>
              <input type="number" id="quiz-maxattempts" class="form-control" value="3" min="1" max="10" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Create Quiz Header & Proceed to Questions &rarr;</button>
        </form>
      </div>

      <!-- STEP 2: Add Questions (Hidden until Step 1 completes) -->
      <div id="quiz-builder-step2" class="card" style="padding: 2.5rem; display: none;">
        <div class="mb-3">
          <span class="badge badge-accent mb-1">Question Builder</span>
          <h2>Step 2: Add Multiple Choice Questions</h2>
        </div>

        <div class="form-group">
          <label class="form-label" for="q-text">Question Text</label>
          <textarea id="q-text" class="form-control" rows="2" placeholder="e.g., Which of the following data structures operates on a Last-In, First-Out (LIFO) basis?"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-1 mb-2">
          <div class="form-group">
            <label class="form-label">Option A</label>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <input type="radio" name="correct-option" value="A" checked>
              <input type="text" id="q-opt-a" class="form-control" placeholder="Option A text">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Option B</label>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <input type="radio" name="correct-option" value="B">
              <input type="text" id="q-opt-b" class="form-control" placeholder="Option B text">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Option C</label>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <input type="radio" name="correct-option" value="C">
              <input type="text" id="q-opt-c" class="form-control" placeholder="Option C text">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Option D</label>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <input type="radio" name="correct-option" value="D">
              <input type="text" id="q-opt-d" class="form-control" placeholder="Option D text">
            </div>
          </div>
        </div>

        <button onclick="handleAddQuestionSubmit()" class="btn btn-accent" style="width: 100%;">➕ Save Question to Quiz</button>
        
        <div class="mt-3 text-center">
          <a href="quizzes.html" class="btn btn-outline btn-sm">Done & Return to Quizzes</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
